services:
  - type: web
    name: gramatica
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Service worker must never be cached, otherwise app updates get stuck
      - path: /sw.js
        name: Cache-Control
        value: no-cache
